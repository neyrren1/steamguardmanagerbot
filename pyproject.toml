[project]
name = "steam-guard-manager-bot"
version = "0.1.0"
description = "Telegram interface for managing Steam Guard accounts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.27,<4",
    "aiohttp>=3.12,<4",
    "aiohttp-socks>=0.11,<1",
    "asyncpg>=0.30,<1",
    "cryptography>=47,<48",
    "lxml>=6.1,<7",
    "pillow>=12.2,<13",
    "python-dotenv>=1.1,<2",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "yarl>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
